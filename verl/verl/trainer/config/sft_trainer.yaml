data:
  train_batch_size: 256
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: 4  # this is also val batch size
  train_files: ~/data/gsm8k/train.parquet
  val_files: ~/data/gsm8k/test.parquet
  # Single-turn settings
  prompt_key: question
  response_key: answer
  prompt_dict_keys: null
  response_dict_keys: null
  # Multi-turn settings
  multiturn:
    enable: false  # Set to true to use multi-turn dataset
    messages_key: messages  # Key for messages list in multi-turn mode
    tools_key: tools  # Key for tools list in multi-turn mode
    enable_thinking_key: enable_thinking  # Whether to enable thinking in multi-turn mode
  max_length: 1024
  truncation: right
  balance_dp_token: False
  chat_template: null
  custom_cls:
    path: null
    name: null
  use_shm: False
model:
  partial_pretrain: ~/models/gemma-1.1-7b-it
  use_shm: False
  fsdp_config:
    model_dtype: fp32
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: True
  trust_remote_code: False
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: all-linear  # Target modules for LoRA adaptation
  use_liger: False
  strategy: fsdp2
optim:
  name: adamw
  module: muon
  loss_mode: dft
  spft:
    lambda: 0.1
    eps: 1e-6
    reference_cpu_offload: false
  psft:
    warmup_steps: 10  # Outer batches; constant LR after warmup
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    mini_batch_size: 32
  lr: 1e-5
  betas: [0.9, 0.95]
  eps: 1e-8
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
  muon_lr: null
  aux_lr: null
  momentum: 0.95
  nesterov: True
  ns_steps: 5
  muon_exclude_name_patterns: [embed_tokens, embeddings, word_embeddings, lm_head, output_layer]
  mbo:
    # minibatch: one raw sample per micro-batch; projection: split post-Polar update by normalized history;
    # global: one final-update sample per optimizer step;
    # onlygrad: rolling queue of final-update samples, without centroid/OT memory;
    # greedy: orthogonalize before P/correction, then do not orthogonalize again
    gradient_source: minibatch
    num_centroids: 16
    centroid_dim: 1024
    lambda_memory: 0.01
    memory_init_seed: null
    ot_ws_steps: 512
    ot_step_update: 64
    kmeans_steps: 10
    ot_epsilon: 0.03
    ot_g_lr: 0.1
    ot_y_lr: 0.01
    ot_g_steps: 5
    ot_y_steps: 5
    offset: 0
    window_size: 0
ulysses_sequence_parallel_size: 1
use_remove_padding: False
trainer:
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_hdfs_dir: null
  resume_path: null
  project_name: gsm8k-sft
  experiment_name: test
  total_epochs: 4
  total_training_steps: null
  logger: [ 'console', 'wandb' ]
  seed: 1
  save_freq: -1
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 8
  max_ckpt_to_keep: null # TODO
