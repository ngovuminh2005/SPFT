### DFT multimodal setting from DFT.pdf (WeThink dataset)
### Prepare first: bash scripts/prepare_wethink.sh

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true
image_max_pixels: 262144

### method
stage: sft
do_train: true
finetuning_type: full
use_dft_loss: true

### dataset
dataset: wethink_sft
dataset_dir: data
media_dir: data/wethink_images
template: qwen2_vl
cutoff_len: 8192
overwrite_cache: false
tokenized_path: data/wethink_tokenized_clean
preprocessing_batch_size: 32
preprocessing_num_workers: 8
dataloader_num_workers: 4
val_size: 0

### output
output_dir: saves/qwen2_5vl-7b/wethink_dft_lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
deepspeed: null
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
gradient_checkpointing: true
bf16: true
ddp_timeout: 180000000

### eval
eval_strategy: "no"
